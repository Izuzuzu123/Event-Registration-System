{% extends "base.html" %}
{% block title %}Verify OTP · LSPU{% endblock %}
{% block content %}
<div class="auth-layout" style="display: flex; justify-content: center; align-items: center; min-height: 60vh;">
    <section class="auth-panel" style="width: 100%; max-width: 450px;">
        <div class="auth-panel-heading" style="text-align: center; margin-bottom: 20px;">
            <h2>Enter OTP</h2>
            <p>We sent a 6-digit code to <strong>{{ email }}</strong>.</p>
        </div>
        <form method="post" class="form-stack">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <label>6-Digit OTP
                <input name="otp" required maxlength="6" pattern="\d{6}" style="text-align: center; letter-spacing: 5px; font-size: 20px;" placeholder="000000">
            </label>
            <label>New Password (12+ chars)
                <input name="new_password" type="password" minlength="12" required>
            </label>
            <button class="btn btn-primary" type="submit" style="margin-top: 15px;">Reset Password</button>
        </form>
        <p class="auth-help" style="text-align: center; margin-top: 15px;">
            <a href="{{ url_for('forgot_password', role=role) }}">Didn't get a code? Try again.</a>
        </p>
    </section>
</div>
{% endblock %}
