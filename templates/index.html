<!DOCTYPE html>
<html>
<head>
    <title>Welcome</title>
    <style>
        body { font-family: Arial; display: flex; justify-content: center; align-items: center; height: 100vh; background: #f4f4f9; margin: 0; flex-direction: column; }
        .title { margin-bottom: 40px; font-size: 32px; }
        .button-container { display: flex; gap: 20px; }
        .btn { padding: 20px 40px; font-size: 18px; text-decoration: none; border-radius: 8px; color: white; font-weight: bold; text-align: center; }
        .btn-user { background: #28a745; }
        .btn-admin { background: #007BFF; }
        .btn:hover { opacity: 0.8; }
    </style>
</head>
<body>
    <h1 class="title">Event Registration System</h1>
    
    <div class="button-container">
        <a href="/events" class="btn btn-user">I am a User (View Events)</a>
        <a href="/login" class="btn btn-admin">I am an Admin (Login)</a>
    </div>
</body>
</html>
