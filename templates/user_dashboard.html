<!DOCTYPE html>
<html>
<head>
    <title>User Dashboard</title>
    <style>
        body { font-family: Arial; background: #f4f4f9; margin: 0; padding: 40px; }
        .container { max-width: 800px; margin: auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .event-card { border: 1px solid #ddd; padding: 20px; border-radius: 8px; margin-top: 20px; }
        .btn { display: inline-block; padding: 10px 20px; background: #28a745; color: white; text-decoration: none; border-radius: 5px; margin-top: 15px; }
        .logout { float: right; color: red; text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        <a href="/logout" class="logout">Logout</a>
        <h1>Welcome, {{ name }}!</h1>
        <p>Here are the upcoming events you can join.</p>

        <div class="event-card">
            <h3>CCS Night</h3>
            <p><strong>Date:</strong> 2026-11-20</p>
            <p><strong>Venue:</strong> LSPU SCC Activity Center</p>
            <p><strong>Time:</strong> 9:00 PM - 5:00 AM</p>
            <a href="/register" class="btn">Register for this Event</a>
        </div>
    </div>
</body>
</html>
