{% extends "base.html" %}
{% block title %}Register · LSPU{% endblock %}
{% block content %}
<div class="auth-layout">
    <section class="auth-panel">
        <div class="auth-panel-heading">
            <span class="panel-overline">{{ role.upper() }} REGISTRATION</span>
            <h2>Create an account</h2>
        </div>
        <form method="post" class="form-stack">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <label>Full Name<input name="name" required></label>
            <label>Email<input name="email" type="email" required></label>
            <label>Password (12+ chars)<input name="password" type="password" minlength="12" required></label>
            
            {% if role == 'student' %}
                <label>Student Number<input name="student_number" required></label>
                <label>Year Level<select name="year_level"><option>First Year</option><option>Second Year</option><option>Third Year</option><option>Fourth Year</option></select></label>
                <label>Section<input name="section" required pattern="[1-4][A-Z]" maxlength="2" placeholder="2B"></label>
                <label>Program<select name="program"><option>BSCS</option><option>BSIT</option></select></label>
            {% else %}
                <label>Handled Sections<input name="handled_sections" placeholder="1A, 2B"></label>
            {% endif %}
            
            <button class="btn btn-primary" type="submit">Register Account</button>
        </form>
        <p class="auth-help" style="margin-top: 15px; text-align: center;">Already have an account? <a href="{{ url_for('sign_in', role=role) }}">Log in</a></p>
    </section>
</div>
{% endblock %}
